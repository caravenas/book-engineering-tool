# Verification contract for book-engineering-tool.
# Run by ~/.agents/workflows/scripts/verify.sh from the agent hooks (Claude Code,
# Codex, Pi), from the pre-commit hook, and before review-gate's integration review.
#
# fast is empty on purpose: a whole-project typecheck after every edit (6 s)
# blocked 45% of subagent edits, most of them for unused names mid-change
# (2026-09-22). There is no linter configured.
# full runs when an agent stops and before each commit: typecheck plus the
# vitest suite.
# skip-when-only: a commit whose staged paths are all documentation or context
# (the research lane) skips both checks at pre-commit; tsc and vitest read none
# of those files. The end-of-turn hooks and review-gate still run everything.

[fast]

[full]
typecheck: npx tsc --noEmit
test: npm test --silent

[skip-when-only]
typecheck: docs/* context/* *.md
test: docs/* context/* *.md